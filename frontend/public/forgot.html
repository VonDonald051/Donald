<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password · VonDonald051 Savings</title>
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <canvas id="ring"></canvas>

  <main class="shell">
    <h1 class="brand">Forgot Password</h1>
    <div id="done" class="ok" hidden>If that email exists, a reset link has been emailed (the V Super Admin is notified). Check your inbox.</div>
    <div id="err" class="err" hidden></div>
    <form id="f" novalidate>
      <label class="lbl" for="email">Email</label>
      <div class="inp-pill"><input id="email" type="email" placeholder="Your account email" required></div>
      <button class="btn" id="go" type="submit" style="margin-top:14px">Send reset link</button>
    </form>
    <a class="signup" href="/login.html">← Back to Login</a>
  </main>

<script src="/js/runtime-config.js"></script>
<script src="/js/api.js"></script>
  <script src="/js/ring.js"></script>
  <script src="/js/forgot.js"></script>
</body>
</html>
