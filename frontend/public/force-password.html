<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password · Chama Savings</title>
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <canvas id="ring"></canvas>
  <main class="shell">
    <h1 class="brand">Set a new password</h1>
    <p class="alt2">You can also change your password from your profile after signing in.</p>
    <div id="err" class="err" hidden></div>
    <form id="force-password-form" autocomplete="on" novalidate>
      <label class="lbl" for="current-password">Temporary password</label>
      <div class="inp-pill"><input id="current-password" type="password" autocomplete="current-password" required></div>
      <label class="lbl" for="new-password">New password</label>
      <div class="inp-pill"><input id="new-password" type="password" autocomplete="new-password" minlength="9" required></div>
      <label class="lbl" for="confirm-password">Confirm new password</label>
      <div class="inp-pill"><input id="confirm-password" type="password" autocomplete="new-password" minlength="9" required></div>
      <button class="btn" id="change-password" type="submit">Change password</button>
    </form>
    <a class="signup" href="/login.html" id="logout-link">Sign out</a>
  </main>
<script src="/js/runtime-config.js"></script>
<script src="/js/api.js"></script>
  <script src="/js/ring.js"></script>
  <script src="/js/force-password.js"></script>
</body>
</html>
